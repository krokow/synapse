<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#1c1036"/>
      <stop offset="0.6" stop-color="#0d0a1c"/>
      <stop offset="1" stop-color="#07060d"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- grille synthwave -->
  <g stroke="url(#floor)" stroke-width="2" fill="none">
    <path d="M0 420 H512 M0 446 H512 M0 476 H512 M0 510 H512"/>
    <path d="M256 400 V512 M196 400 L120 512 M316 400 L392 512 M136 400 L-10 512 M376 400 L522 512"/>
  </g>

  <!-- dendrites -->
  <g stroke="#05d9e8" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <path d="M352 148 L400 104 M196 148 L150 98 M160 214 L102 214 M352 298 L410 300 M316 364 L360 410 M160 364 L112 404"/>
  </g>
  <g fill="#05d9e8" fill-opacity="0.55">
    <circle cx="400" cy="104" r="7"/><circle cx="150" cy="98" r="7"/><circle cx="102" cy="214" r="7"/>
    <circle cx="410" cy="300" r="7"/><circle cx="360" cy="410" r="7"/><circle cx="112" cy="404" r="7"/>
  </g>

  <!-- S neuronal : décalage glitch rose -->
  <path d="M352 148 L196 148 L160 214 L256 256 L352 298 L316 364 L160 364"
        fill="none" stroke="#ff2a6d" stroke-opacity="0.75" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"
        transform="translate(-9 4)"/>
  <!-- S neuronal : tracé principal cyan -->
  <path d="M352 148 L196 148 L160 214 L256 256 L352 298 L316 364 L160 364"
        fill="none" stroke="#05d9e8" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- nœuds -->
  <g filter="url(#glow)">
    <circle cx="352" cy="148" r="22" fill="#ff2a6d"/>
    <circle cx="196" cy="148" r="17" fill="#f9f002"/>
    <circle cx="160" cy="214" r="17" fill="#05d9e8"/>
    <circle cx="256" cy="256" r="26" fill="#f9f002"/>
    <circle cx="352" cy="298" r="17" fill="#05d9e8"/>
    <circle cx="316" cy="364" r="17" fill="#f9f002"/>
    <circle cx="160" cy="364" r="22" fill="#ff2a6d"/>
  </g>
  <circle cx="256" cy="256" r="10" fill="#fff" fill-opacity="0.9"/>
</svg>
